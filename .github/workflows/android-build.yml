name: Pipra Android CI & APK Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build, Test & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK environment and licenses
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          yes | sdkmanager --licenses || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate debug keystore for debug APK signing
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cp debug.keystore app/debug.keystore

      - name: Cache Robolectric runtime SDK artifact
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository/org/robolectric
            .robolectric-cache
          key: ${{ runner.os }}-robolectric-sdk36-16-robolectric-13921718-i7

      - name: Pre-fetch Robolectric SDK 36 artifact with bounded retry
        run: |
          mkdir -p .robolectric-cache
          JAR_NAME="android-all-instrumented-16-robolectric-13921718-i7.jar"
          TARGET=".robolectric-cache/${JAR_NAME}"
          REL_PATH="org/robolectric/android-all-instrumented/16-robolectric-13921718-i7/${JAR_NAME}"
          M2_CACHED="${HOME}/.m2/repository/${REL_PATH}"

          if [ ! -f "$TARGET" ] && [ -f "$M2_CACHED" ] && jar tf "$M2_CACHED" >/dev/null 2>&1; then
            cp "$M2_CACHED" "$TARGET"
          fi

          if [ ! -f "$TARGET" ] || ! jar tf "$TARGET" >/dev/null 2>&1; then
            rm -f "$TARGET"
            TMP_JAR="${TARGET}.tmp"
            DELAYS=(2 5 10)
            URLS=(
              "https://repo.maven.apache.org/maven2/${REL_PATH}"
              "https://maven-central.storage-download.googleapis.com/maven2/${REL_PATH}"
              "https://repo1.maven.org/maven2/${REL_PATH}"
            )
            for attempt in 1 2 3; do
              for idx in "${!URLS[@]}"; do
                URL="${URLS[$idx]}"
                echo "Downloading Robolectric SDK 36 from ${URL} (attempt ${attempt}/3)..."
                if curl -fSL --connect-timeout 20 --max-time 180 -A "PipraCI/1.0" -o "$TMP_JAR" "$URL" && jar tf "$TMP_JAR" >/dev/null 2>&1; then
                  mv "$TMP_JAR" "$TARGET"
                  mkdir -p "$(dirname "$M2_CACHED")"
                  cp -f "$TARGET" "$M2_CACHED"
                  echo "Successfully cached ${JAR_NAME} from ${URL}."
                  break 2
                fi
                rm -f "$TMP_JAR"
              done
              SLEEP_SECS="${DELAYS[$((attempt - 1))]}"
              echo "All mirrors failed on attempt ${attempt}; backing off ${SLEEP_SECS}s..."
              sleep "$SLEEP_SECS"
            done
          fi

          if [ -f "$TARGET" ] && jar tf "$TARGET" >/dev/null 2>&1; then
            if [ ! -f "$M2_CACHED" ]; then
              mkdir -p "$(dirname "$M2_CACHED")"
              cp -f "$TARGET" "$M2_CACHED"
            fi
            echo "ROBOLECTRIC_CACHE_READY=true" >> "$GITHUB_ENV"
          else
            echo "::warning::Could not pre-fetch ${JAR_NAME}; :app:testDebugUnitTest will fall back to Robolectric MavenDependencyResolver."
            echo "ROBOLECTRIC_CACHE_READY=false" >> "$GITHUB_ENV"
          fi

      - name: Run unit and Robolectric tests
        run: |
          if [ "${ROBOLECTRIC_CACHE_READY:-false}" = "true" ]; then
            gradle :app:testDebugUnitTest -Drobolectric.dependency.dir="${GITHUB_WORKSPACE}/.robolectric-cache" -Drobolectric.offline=true --no-daemon
          else
            gradle :app:testDebugUnitTest --no-daemon
          fi

      - name: Upload unit test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pipra-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Check Release signing secrets
        id: check_signing
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          HAS_STORE_PASS: ${{ secrets.STORE_PASSWORD != '' }}
          HAS_KEY_PASS: ${{ secrets.KEY_PASSWORD != '' }}
        run: |
          if [ "$HAS_KEYSTORE" = "true" ] && [ "$HAS_STORE_PASS" = "true" ] && [ "$HAS_KEY_PASS" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets not configured; skipping signed Release APK."
          fi

      - name: Decode release upload keystore
        if: steps.check_signing.outputs.ready == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "${GITHUB_WORKSPACE}/my-upload-key.jks"

      - name: Build Signed Release APK
        if: steps.check_signing.outputs.ready == 'true'
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Remove temporary keystore from runner
        if: always()
        run: rm -f "${GITHUB_WORKSPACE}/my-upload-key.jks"

      - name: Upload Signed Release APK artifact
        if: steps.check_signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pipra-signed-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
