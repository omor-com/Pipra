<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#030303">
<meta name="description" content="Pipra — a refined browser start page designed for a clearer, faster way to explore the web.">
<title>Pipra — Explore the Web</title>
<style>
:root{
  color-scheme:dark;
  --accent:#668cff;
  --accent-soft:rgba(102,140,255,.15);
  --bg:#08090c;
  --surface:#14161b;
  --surface-2:#1b1e24;
  --line:rgba(255,255,255,.09);
  --text:#f5f6f8;
  --muted:#9299a5;
  --font:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--font)}
body{min-height:100svh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button,input{font:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
.page{
  position:relative;isolation:isolate;min-height:100svh;min-height:100dvh;overflow:hidden;
  background:
    radial-gradient(ellipse at 50% 28%,rgba(48,53,66,.32),transparent 42%),
    linear-gradient(145deg,#0c0e12 0%,#08090c 58%,#050608 100%);
}
.waves{position:absolute;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;opacity:.48}
main{
  position:relative;z-index:1;width:100%;min-height:100svh;min-height:100dvh;
  display:flex;align-items:center;flex-direction:column;
  padding:clamp(72px,15vh,150px) 24px 72px;
}
.brand{display:flex;align-items:center;flex-direction:column;width:100%;margin:0 0 38px}
.ant{display:block;width:clamp(112px,17vw,138px);height:clamp(142px,21vw,176px);object-fit:contain;filter:drop-shadow(0 12px 28px rgba(0,0,0,.34))}
.brand-copy{text-align:center;margin-top:12px}
.brand-name{margin:0;font-size:clamp(21px,4vw,27px);font-weight:750;letter-spacing:.22em;padding-left:.22em}
.brand-tagline{margin:8px 0 0;color:var(--muted);font-size:13px;letter-spacing:.025em}
.search{
  width:100%;max-width:660px;min-height:66px;display:flex;align-items:center;gap:14px;
  padding:0 10px 0 20px;border-radius:19px;border:1px solid var(--line);
  background:rgba(24,27,33,.88);backdrop-filter:blur(18px);
  box-shadow:0 18px 55px rgba(0,0,0,.26),inset 0 1px 0 rgba(255,255,255,.035);
  transition:border-color .2s,box-shadow .2s,transform .2s;
}
.search:focus-within{border-color:rgba(102,140,255,.65);box-shadow:0 18px 55px rgba(0,0,0,.3),0 0 0 4px var(--accent-soft)}
.google-g{width:25px;height:25px;flex:0 0 25px;object-fit:contain;display:block}
.search input{min-width:0;flex:1;background:transparent;border:0;outline:0;color:var(--text);font-size:15px;font-family:inherit}
.search input::placeholder{color:#858c98;opacity:1}
.search button{
  width:46px;height:46px;flex:0 0 46px;border:0;border-radius:14px;
  background:var(--accent);color:white;display:grid;place-items:center;cursor:pointer;
  box-shadow:0 5px 16px rgba(102,140,255,.22);transition:transform .18s,background .18s;
}
.search button:hover{background:#82a1ff;transform:translateY(-1px)}
.search button:active{transform:scale(.96)}
.search button svg{width:22px;height:22px}
.shortcuts{width:100%;max-width:660px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:26px 18px;margin-top:58px}
.add-shortcut{
  grid-column:1/-1;justify-self:center;display:flex;align-items:center;flex-direction:column;
  gap:11px;min-width:130px;padding:0 12px 10px;border:0;background:transparent;
  color:#e9ebef;font:inherit;cursor:pointer;
}
.plusbox{
  width:64px;height:64px;display:grid;place-items:center;border:1px solid rgba(102,140,255,.55);
  border-radius:20px;background:linear-gradient(145deg,rgba(102,140,255,.12),rgba(255,255,255,.025));
  color:#9bb4ff;transition:transform .2s,border-color .2s,background .2s;
}
.plusbox svg{width:27px;height:27px}
.add-label{font-size:13px;font-weight:600;color:#c9cdd5}
.add-shortcut:hover .plusbox{transform:translateY(-3px);border-color:var(--accent);background:var(--accent-soft)}
.shortcut{
  position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;
  color:#dfe2e8;text-decoration:none;min-width:0;font-size:12px;font-weight:500;
  overflow-wrap:anywhere;transition:color .18s,transform .18s;
}
.shortcut:hover{color:#fff;transform:translateY(-3px)}
.shortcut-icon{
  width:54px;height:54px;border-radius:17px;background:var(--surface-2);
  border:1px solid var(--line);display:grid;place-items:center;font-size:19px;
  font-weight:650;color:#fff;box-shadow:0 7px 18px rgba(0,0,0,.18);
}
.shortcut-remove{
  position:absolute;top:-7px;right:calc(50% - 36px);width:21px;height:21px;
  border-radius:50%;border:1px solid #454952;background:#252830;color:white;
  font-size:14px;display:grid;place-items:center;cursor:pointer;opacity:0;
  transition:opacity .18s,background .18s;
}
.shortcut:hover .shortcut-remove,.shortcut-remove:focus-visible{opacity:1}
.shortcut-remove:hover{background:var(--accent)}
.dialog-backdrop{
  position:fixed;inset:0;z-index:5;background:rgba(2,3,5,.76);backdrop-filter:blur(9px);
  display:none;align-items:center;justify-content:center;padding:22px;
}
.dialog-backdrop.open{display:flex}
.dialog{
  width:min(100%,390px);border:1px solid var(--line);border-radius:24px;
  background:#171a20;padding:26px;box-shadow:0 24px 90px rgba(0,0,0,.55);
  animation:dialog-in .2s ease-out;
}
@keyframes dialog-in{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
.dialog h2{font-size:20px;margin:0 0 22px;font-weight:700;letter-spacing:-.025em}
.dialog label{display:block;font-size:12px;font-weight:600;color:#aeb5c0;margin:15px 0 8px}
.dialog input{
  width:100%;padding:13px 14px;border:1px solid #343943;border-radius:12px;
  background:#0d0f13;color:#fff;font-size:14px;outline:none;transition:border-color .18s,box-shadow .18s;
}
.dialog input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}
.dialog-actions button{
  padding:11px 17px;border-radius:11px;border:1px solid #3b404a;
  background:#242831;color:#e7e9ed;font-size:13px;font-weight:600;cursor:pointer;
  transition:background .18s,transform .18s;
}
.dialog-actions button:hover{background:#303641}
.dialog-actions .save{background:var(--accent);border-color:var(--accent);color:white}
.dialog-actions .save:hover{background:#82a1ff}
.notice{
  position:fixed;z-index:6;bottom:24px;left:50%;transform:translateX(-50%);
  max-width:90vw;padding:12px 17px;border-radius:12px;background:#20242c;
  border:1px solid #414753;color:white;font-size:13px;box-shadow:0 10px 35px #0008;
  display:none;text-align:center;
}
.notice.show{display:block}
@media(max-width:560px){
  main{padding:clamp(58px,12vh,105px) 20px 54px}
  .brand{margin-bottom:32px}
  .search{min-height:60px;border-radius:17px;padding-left:16px}
  .search button{width:42px;height:42px;flex-basis:42px;border-radius:13px}
  .shortcuts{grid-template-columns:repeat(4,minmax(0,1fr));gap:24px 8px;margin-top:48px}
  .shortcut-icon{width:49px;height:49px;border-radius:15px}
}
@media(max-height:700px){
  main{padding-top:34px}
  .brand{margin-bottom:24px}
  .ant{width:100px;height:100px}
  .brand-copy{margin-top:4px}
  .shortcuts{margin-top:32px}
}
@media(min-width:900px){
  main{padding-top:min(13vh,125px)}
  .shortcuts{margin-top:64px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

<script>
(() => {
 const $ = id => document.getElementById(id);
 const form = $('searchForm'), query = $('query'), shortcuts = $('shortcuts');
 const backdrop = $('dialogBackdrop'), shortcutForm = $('shortcutForm');
 const STORAGE_KEY = 'pipra-home-shortcuts-v1';
 let items = [];
 try { const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); if (Array.isArray(saved)) items = saved.filter(x => x && typeof x.name === 'string' && typeof x.url === 'string').slice(0, 12); } catch (_) {}
 function normalizeUrl(raw) {
   let value = raw.trim();
   if (!value) return '';
   if (/^[a-zA-Z][a-zA-Z\d+.-]*:/.test(value)) {
     try { const u = new URL(value); return ['http:','https:'].includes(u.protocol) ? u.href : ''; } catch (_) { return ''; }
   }
   if (value.includes('.') && !/\s/.test(value)) {
     try { return new URL('https://' + value).href; } catch (_) {}
   }
   return 'https://duckduckgo.com/?q=' + encodeURIComponent(value);
 }
 function go(raw) {
   const url = normalizeUrl(raw);
   if (!url) { showNotice('Please enter a valid website address or search term.'); return; }
   // The home page and its assets are offline; opening websites/search requires internet.
   window.location.href = url;
 }
 form.addEventListener('submit', e => { e.preventDefault(); go(query.value); });
 function save() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); } catch (_) { showNotice('Could not save shortcuts in this browser.'); } }
 function iconText(name) { return (name.trim().charAt(0) || 'W').toUpperCase(); }
 function render() {
   shortcuts.querySelectorAll('.shortcut').forEach(el => el.remove());
   const add = $('addShortcut');
   items.forEach((item, index) => {
     const a = document.createElement('a'); a.className = 'shortcut'; a.href = item.url; a.title = item.name;
     const ico = document.createElement('span'); ico.className = 'shortcut-icon'; ico.textContent = iconText(item.name);
     const label = document.createElement('span'); label.textContent = item.name;
     const remove = document.createElement('button'); remove.className = 'shortcut-remove'; remove.type = 'button'; remove.textContent = '×'; remove.setAttribute('aria-label', 'Remove ' + item.name);
     remove.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); items.splice(index, 1); save(); render(); });
     a.append(ico, label, remove);
     a.addEventListener('click', e => { if (e.target === remove) return; e.preventDefault(); window.location.href = item.url; });
     shortcuts.insertBefore(a, add);
   });
   add.style.display = items.length >= 12 ? 'none' : 'flex';
 }
 function openDialog() { if (items.length >= 12) return; shortcutForm.reset(); backdrop.classList.add('open'); $('siteName').focus(); }
 function closeDialog() { backdrop.classList.remove('open'); $('addShortcut').focus(); }
 $('addShortcut').addEventListener('click', openDialog);
 $('cancelDialog').addEventListener('click', closeDialog);
 backdrop.addEventListener('click', e => { if (e.target === backdrop) closeDialog(); });
 document.addEventListener('keydown', e => { if (e.key === 'Escape' && backdrop.classList.contains('open')) closeDialog(); });
 shortcutForm.addEventListener('submit', e => {
   e.preventDefault();
   const name = $('siteName').value.trim(), url = normalizeUrl($('siteUrl').value);
   if (!name || !url || !/^https?:\/\//i.test(url)) { showNotice('Enter a valid website address.'); return; }
   if (items.length >= 12) { showNotice('You can add up to 12 shortcuts.'); closeDialog(); return; }
   items.push({name, url}); save(); render(); closeDialog();
 });
 let noticeTimer;
 function showNotice(text) { const n = $('notice'); n.textContent = text; n.classList.add('show'); clearTimeout(noticeTimer); noticeTimer = setTimeout(() => n.classList.remove('show'), 2600); }
 render();
})();
</script>
